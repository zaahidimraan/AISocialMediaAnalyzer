<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Research Agent</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 24px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        
        .report-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
        .finding-card { background: #f8f9fa; padding: 15px; margin-bottom: 15px; border-left: 4px solid #3498db; border-radius: 4px; }
        
        /* Loading Spinner */
        .loader { display: none; text-align: center; margin: 20px 0; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕵️ Deep Research Agent</h1>
        
        <form method="POST" onsubmit="document.getElementById('loader').style.display='block'">
            <div class="search-box">
                <input type="text" name="target_name" placeholder="Enter name (e.g., Elon Musk)" required value="{{ target if target else '' }}">
                <button type="submit">Start Investigation</button>
            </div>
        </form>

        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p>Running multi-step analysis... (This may take 15-30 seconds)</p>
        </div>

        {% if report %}
        <div class="report-section">
            <h2>Research Findings for: {{ target }}</h2>
            <div class="finding-card">
                {{ report }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
